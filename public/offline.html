<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — MaterialDepot CRM</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #FAFAFA; color: #1F3A5F; font-family: Inter, system-ui, sans-serif; padding: 24px; }
      .box { text-align: center; max-width: 420px; }
      img { width: 64px; height: 64px; margin-bottom: 20px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 13.5px; line-height: 1.6; color: #6B7280; margin: 0 0 20px; }
      button { background: #1F3A5F; color: #fff; border: 0; border-radius: 6px;
               padding: 9px 18px; font-size: 13px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <!-- Deliberately blunt: this CRM reads live orders, slots and permissions
           on every view, so there is no useful cached version to show. Saying so
           beats a half-loaded screen of stale data. -->
      <p>The CRM needs a connection — orders, slots and availability are read live. Anything you were filling in is still in this tab.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
